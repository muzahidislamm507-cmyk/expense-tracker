<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>টাকা ও খরচের হিসাব</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c1e21;--mu:#6b7280;--ac:#0f766e;--bd:#e5e7eb;--rd:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111315;--card:#1b1e21;--tx:#eceff1;--mu:#9aa3ab;--ac:#2dd4bf;--bd:#2c3136;--rd:#f87171}}
:root[data-theme="dark"]{--bg:#111315;--card:#1b1e21;--tx:#eceff1;--mu:#9aa3ab;--ac:#2dd4bf;--bd:#2c3136;--rd:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Bengali",system-ui,sans-serif;padding:16px;padding-bottom:90px}
.w{max-width:520px;margin:0 auto}
h1{font-size:22px;margin:4px 0 14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.tot{font-size:30px;font-weight:700;color:var(--ac)}
.mu{color:var(--mu);font-size:13px}
input,select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%;box-sizing:border-box;margin-top:8px}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}
.r{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);gap:8px}
.r:last-child{border:0}
.x{background:none;color:var(--rd);width:auto;margin:0;padding:4px 8px}
.bar{height:8px;background:var(--ac);border-radius:4px;margin-top:4px}
.bar.e{background:var(--rd)}
.bar.shop{background:#d97706}
input[type=date]{color-scheme:light dark;min-height:44px;cursor:pointer}
.pd{background:none;color:var(--ac);width:auto;margin:0 6px 0 0;padding:6px 10px;border:1px solid var(--ac);border-radius:8px;font-size:14px}
.late{color:var(--rd)}
.done{text-decoration:line-through;opacity:.55}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.v{font-size:22px;font-weight:700}
.inc{color:var(--ac)}
.exp{color:var(--rd)}
.sh{color:#d97706}
.tg{display:flex;gap:8px;flex-wrap:wrap}
.tg button{margin-top:0;background:var(--bg);color:var(--mu);border:1px solid var(--bd);flex:1 1 40%}
.tg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#add.e{background:var(--rd)}
#add.shop{background:#d97706}
/* নিচের মেনু */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;gap:2px;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;width:auto;margin:0;padding:9px 2px;font-size:12px;line-height:1.25;background:none;color:var(--mu);border:0;border-radius:10px}
.nav button.on{background:var(--ac);color:#fff}
.nav button.on.e{background:var(--rd)}
.nav button.on.shop{background:#d97706}
#gOwe{cursor:pointer}
</style>
</head>
<body>
<div class="w">
<h1>💰 টাকা ও খরচের হিসাব</h1>
<div class="c">
<div class="g">
<div><div class="mu">মোট পেয়েছি</div><div class="v inc" id="inc">৳০</div></div>
<div><div class="mu">মোট খরচ</div><div class="v exp" id="exp">৳০</div></div>
<div><div class="mu">দোকানের বাকি</div><div class="v sh" id="shT">৳০</div></div>
<div><div class="mu">নিজের দোকান</div><div class="v sh" id="owT">৳০</div></div>
<div id="gOwe"><div class="mu">আমার দেনা (ট্যাপ করুন)</div><div class="v exp" id="oweT">৳০</div></div>
<div><div class="mu">আমার পাওনা</div><div class="v inc" id="recT">৳০</div></div>
</div>
<div style="margin-top:12px"><div class="mu">হাতে আছে (পাওয়া − খরচ)</div><div class="tot" id="tot">৳০</div></div>
</div>
<div class="c" id="form">
<div class="tg" id="dsub" style="display:none;margin-bottom:8px">
<button id="bB" type="button">ধার নিছি</button>
<button id="bP" type="button">ধার শোধ করছি</button>
</div>
<input id="amt" type="number" inputmode="decimal" placeholder="টাকার পরিমাণ">
<select id="cat"></select>
<input id="cnt" type="number" inputmode="numeric" style="display:none" placeholder="কয়টা সিগারেট? (সংখ্যা)">
<select id="dsel" style="display:none"></select>
<input id="who" style="display:none">
<input id="shopName" style="display:none" placeholder="দোকানের নাম">
<div class="mu" id="dueL" style="display:none;margin-top:8px"></div>
<input id="due" type="date" style="display:none;margin-top:4px">
<input id="note" placeholder="বিবরণ (ঐচ্ছিক)">
<button id="add" class="e">খরচ যোগ করো</button>
</div>
<div class="c"><b>ধার / ঋণের হিসাব</b>
<div class="mu" id="dTot"></div>
<div id="dlist" style="margin-top:6px"></div>
</div>
<div class="c"><b>দোকানের বাকি হিসাব</b><div id="sumShop"></div></div>
<div class="c"><b>নিজের দোকান থেকে নেওয়া</b><div class="mu" id="ownTot"></div><div id="sumOwn"></div></div>
<div class="c"><b>কার কাছ থেকে পেয়েছি</b><div id="sumI"></div></div>
<div class="c"><b>ক্যাটাগরি অনুযায়ী খরচ</b><div id="sumE"></div></div>
<div class="c"><b>এইমাত্র যোগ করা (১০ মিনিট পর্যন্ত বাতিল করা যাবে)</b><div id="list"></div></div>
</div>

<div class="nav">
<button id="tE" class="on e" type="button">খরচ</button>
<button id="tI" type="button">টাকা পেয়েছি</button>
<button id="tS" type="button">দোকানের বাকি</button>
<button id="tO" type="button">নিজের দোকান</button>
<button id="tD" type="button">আমার দেনা</button>
</div>

<script>
var SHEET_URL="https://script.google.com/macros/s/AKfycbwqkU23NgXwZhgZJIPNAqyQrsSsNkjoVwGccdZby1GRvAouNi1EMOZLK4IZqziK2MtVzg/exec";
function post(item){
return fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(item)});
}
function getQ(){try{return JSON.parse(localStorage.getItem("pending")||"[]")}catch(e){return []}}
function setQ(q){try{localStorage.setItem("pending",JSON.stringify(q))}catch(e){}}
function sendToSheet(item){
if(!SHEET_URL)return;
post(item).catch(function(){var q=getQ();q.push(item);setQ(q)});
}
function flush(){
if(!SHEET_URL)return;
var q=getQ();if(!q.length)return;
setQ([]);
q.forEach(function(it){post(it).catch(function(){var r=getQ();r.push(it);setQ(r)})});
}
window.addEventListener("online",flush);

var C_BORROW="ধার নিয়েছি",C_LEND="ধার দিয়েছি",C_PAY="ধার শোধ করলাম",C_GET="ধার ফেরত পেলাম",C_CIG="সিগারেট";
var CATS={
e:["খাবার","যাতায়াত","পড়াশোনা","ক্যারাম খেলা",C_CIG,"অন্যান্য",C_PAY,C_LEND],
i:["উপহার","সাহায্য","অন্যান্য",C_BORROW,C_GET],
s:["খাবার",C_CIG,"অন্যান্য"],
o:["খাবার",C_CIG,"নগদ টাকা"],
d:[C_BORROW,C_PAY]
};
var type="e";
var data=[];
try{data=JSON.parse(localStorage.getItem("exp")||"[]")}catch(e){}
function save(){try{localStorage.setItem("exp",JSON.stringify(data))}catch(e){}}
var bn="০১২৩৪৫৬৭৮৯";
function f(n){return (n<0?"-":"")+"৳"+String(Math.round(Math.abs(n)*100)/100).replace(/\d/g,function(d){return bn[d]})}
function isInc(d){return d.t==="i"}

function fillDsel(c){
var sel=document.getElementById("dsel");
if(c!==C_PAY&&c!==C_GET){sel.style.display="none";return}
var dir=c===C_PAY?"b":"l";
var open=debts.filter(function(d){return d.dir===dir&&remOf(d)>0});
sel.innerHTML=open.length?open.map(function(d){return '<option value="'+d.id+'">'+(d.w||"নাম নেই")+' — বাকি '+f(remOf(d))+'</option>'}).join(""):'<option value="">'+(dir==="b"?"কারো কাছে ধার বাকি নেই":"কেউ ধার ফেরত দেওয়ার বাকি নেই")+'</option>';
sel.style.display="block";
}

function updateFields(){
var c=document.getElementById("cat").value;
var add=document.getElementById("add");
var who=document.getElementById("who");
var show=function(id,on){document.getElementById(id).style.display=on?"block":"none"};
show("who",false);show("shopName",false);show("dueL",false);show("due",false);show("dsel",false);
show("cat",type!=="d");
show("dsub",type==="d");
document.getElementById("bB").className=(type==="d"&&c===C_BORROW)?"on":"";
document.getElementById("bP").className=(type==="d"&&c===C_PAY)?"on":"";
show("cnt",(type==="e"||type==="o")&&c===C_CIG);
if(type==="s"){
  add.className="shop";
  add.textContent="দোকানের বাকি যোগ করো";
  show("shopName",true);
} else if(type==="o"){
  add.className="shop";
  add.textContent="নিজের দোকান থেকে নেওয়া যোগ করো";
} else {
  var e=type==="e";
  add.className=e?"e":"";
  var lbl={};lbl[C_BORROW]="ধার নেওয়া যোগ করো";lbl[C_LEND]="ধার দেওয়া যোগ করো";lbl[C_PAY]="ধার শোধ যোগ করো";lbl[C_GET]="ফেরত পাওয়া যোগ করো";
  add.textContent=lbl[c]||(e?"খরচ যোগ করো":"টাকা যোগ করো");
  var needSel=(c===C_PAY||c===C_GET),needDue=(c===C_BORROW||c===C_LEND),needWho=!needSel&&(type==="i"||type==="d"||c===C_LEND);
  show("who",needWho);
  who.placeholder=c===C_BORROW?(type==="d"?"নাম (কার কাছ থেকে নিয়েছ?)":"কার কাছ থেকে নিয়েছ? (নাম)"):c===C_LEND?"কাকে ধার দিয়েছ? (নাম)":"কার কাছ থেকে পেয়েছি? (ঐচ্ছিক)";
  var payDate=(type==="d"&&c===C_PAY);
  show("dueL",needDue||payDate);show("due",needDue||payDate);
  document.getElementById("dueL").textContent=payDate?"শোধের তারিখ (ঐচ্ছিক, না দিলে আজকের তারিখ)":(c===C_BORROW?"কবে দিতে হবে — তারিখ (ঐচ্ছিক, ট্যাপ করে বেছে নিন)":"ফেরত পাওয়ার তারিখ (ঐচ্ছিক, ট্যাপ করে বেছে নিন)");
  fillDsel(c);
}
}

function setType(t){
type=t;
document.getElementById("tE").className=(t==="e"?"on e":"");
document.getElementById("tI").className=(t==="i"?"on":"");
document.getElementById("tS").className=(t==="s"?"on shop":"");
document.getElementById("tO").className=(t==="o"?"on shop":"");
document.getElementById("tD").className=(t==="d"?"on e":"");
document.getElementById("cat").innerHTML=CATS[t].map(function(c){return "<option>"+c+"</option>"}).join("");
updateFields();
}

document.getElementById("cat").onchange=updateFields;
document.getElementById("tE").onclick=function(){setType("e")};
document.getElementById("tI").onclick=function(){setType("i")};
document.getElementById("tS").onclick=function(){setType("s")};
document.getElementById("tO").onclick=function(){setType("o")};
document.getElementById("tD").onclick=function(){setType("d")};
document.getElementById("gOwe").onclick=function(){setType("d");window.scrollTo({top:0,behavior:"smooth"})};
document.getElementById("bB").onclick=function(){document.getElementById("cat").value=C_BORROW;updateFields()};
document.getElementById("bP").onclick=function(){document.getElementById("cat").value=C_PAY;updateFields()};

function bars(by,total,cls){
var s="";
Object.keys(by).forEach(function(k){
var w=total>0?by[k]/total*100:0;
s+='<div style="margin-top:10px"><div class="r" style="border:0;padding:0"><span>'+k+'</span><span>'+f(by[k])+'</span></div><div class="bar '+cls+'" style="width:'+w+'%"></div></div>';
});
return s||'<div class="mu">এখনো কিছু নেই</div>';
}
function sum(o){var s=0;Object.keys(o).forEach(function(k){s+=o[k]});return s}

function render(){
var ti=0,te=0,bi={},be={},bs={},bo={},cigE=0,cigO=0;
data.forEach(function(d){
if(isInc(d)){var w=d.w||"নাম দেওয়া নেই";ti+=d.a;bi[w]=(bi[w]||0)+d.a}
else if(d.t==="s"){var sName=d.shop||"অন্যান্য দোকান";bs[sName]=(bs[sName]||0)+d.a}
else if(d.t==="o"){bo[d.c]=(bo[d.c]||0)+d.a;if(d.c===C_CIG)cigO+=(d.cnt||0)}
else{te+=d.a;be[d.c]=(be[d.c]||0)+d.a;if(d.c===C_CIG)cigE+=(d.cnt||0)}
});
document.getElementById("inc").textContent=f(ti);
document.getElementById("exp").textContent=f(te);
document.getElementById("tot").textContent=f(ti-te);
document.getElementById("shT").textContent=f(sum(bs));document.getElementById("owT").textContent=f(sum(bo));
document.getElementById("sumShop").innerHTML=bars(bs,sum(bs),"shop");
document.getElementById("sumOwn").innerHTML=bars(bo,sum(bo),"shop");
document.getElementById("ownTot").textContent=cigO>0?"মোট সিগারেট: "+bd(cigO)+" টা":"";
document.getElementById("sumI").innerHTML=bars(bi,ti,"");
document.getElementById("sumE").innerHTML=bars(be,te,"e")+(cigE>0?'<div class="mu" style="margin-top:10px">মোট সিগারেট কিনেছি: '+bd(cigE)+' টা</div>':'');
var l="",now=Date.now(),W=600000;
data.slice().reverse().forEach(function(d){
if(!d.ts||now-d.ts>=W)return;
var i=data.indexOf(d);
var inc=isInc(d), shopTr=d.t==="s", own=d.t==="o";
var symbol=inc?"+":((shopTr||own)?"":"-");
var cn=d.cnt?" · "+bd(d.cnt)+" টা":"";
var desc=shopTr?("দোকান: "+d.shop+" ("+d.c+")"):own?("নিজের দোকান · "+d.c+cn):(d.c+cn+(inc&&d.w?' · '+d.w:''));
var left=Math.max(1,Math.ceil((W-(now-d.ts))/60000));
l+='<div class="r"><div><div class="'+(inc?"inc":((shopTr||own)?"sh":"exp"))+'">'+symbol+f(d.a)+' · '+desc+'</div><div class="mu">'+(d.n?d.n+' · ':'')+'আর '+bd(left)+' মিনিট বাতিল করা যাবে</div></div><button class="pd" data-i="'+i+'">বাতিল</button></div>';
});
document.getElementById("list").innerHTML=l||'<div class="mu">গত ১০ মিনিটে কিছু যোগ করা হয়নি</div>';
}

document.getElementById("add").onclick=function(){
var a=parseFloat(document.getElementById("amt").value);
if(!(a>0))return;
var c=document.getElementById("cat").value,note=clean(document.getElementById("note").value),who=clean(document.getElementById("who").value),shopName=clean(document.getElementById("shopName").value),due=document.getElementById("due").value,ds=today0(),sheet;
var cnt=(c===C_CIG&&(type==="e"||type==="o"))?(parseInt(document.getElementById("cnt").value,10)||0):0;

if(type==="s"){
if(!shopName){alert("দোকানের নাম লিখুন");return}
data.push({a:a,t:"s",c:c,shop:shopName,n:note,d:ds,ts:Date.now()});
sheet={amount:a,category:c,note:note,type:"দোকানের বাকি",shop:shopName};
}else if(type==="o"){
data.push({a:a,t:"o",c:c,cnt:cnt,n:note,d:ds,ts:Date.now()});
sheet={amount:a,category:c,note:note,type:"নিজের দোকান",cigs:cnt};
}else if(c===C_BORROW||c===C_LEND){
if(!who){alert("কার সাথে ধারের লেনদেন, সেই নামটা লেখো");return}
var id=Date.now(),lent=c===C_LEND;
debts.push({id:id,a:a,w:who,due:due,dir:lent?"l":"b",pays:[]});
data.push({a:a,t:lent?"e":"i",c:c,w:who,n:note,d:ds,ts:Date.now(),ref:"i"+id});
sheet={amount:a,category:c,note:note,type:lent?"ধার দিয়েছি":"ঋণ",from:who,due:due};
}else if(c===C_PAY||c===C_GET){
var did=document.getElementById("dsel").value;
var d=debts.filter(function(x){return String(x.id)===did})[0];
if(!d){alert("কার ধার, সেটা বেছে নাও");return}
var rem=remOf(d);if(a>rem)a=rem;
var ref=d.id+"-"+Date.now();
d.pays.push({a:a,ref:ref});
if(type==="d"&&due)ds=new Date(due+"T00:00:00").toLocaleDateString("bn-BD");
var nt=note||((d.w||"")+(c===C_PAY?" কে ধার শোধ":" এর কাছ থেকে ধার ফেরত"));
data.push({a:a,t:c===C_PAY?"e":"i",c:c,w:c===C_GET?d.w:"",n:nt,d:ds,ts:Date.now(),ref:ref});
sheet={amount:a,category:c,note:nt,type:c===C_PAY?"খরচ":"টাকা পেয়েছি",from:c===C_GET?d.w:""};
}else{
var inc=type==="i";
data.push({a:a,t:type,c:c,w:inc?who:"",n:note,d:ds,ts:Date.now(),cnt:cnt});
sheet={amount:a,category:c,note:note,type:inc?"টাকা পেয়েছি":"খরচ",from:inc?who:"",cigs:cnt};
}
["amt","note","who","shopName","due","cnt"].forEach(function(id){document.getElementById(id).value=""});
sendToSheet(sheet);
save();saveD();render();renderDebts();updateFields();
};

document.getElementById("list").onclick=function(e){
var i=e.target.getAttribute("data-i");
if(i===null)return;
var d=data[+i];if(!d||!d.ts||Date.now()-d.ts>=600000){render();return}
if(!confirm("এই হিসাবটা বাতিল করবে?"))return;
var r=String(d.ref||"");
if(r.charAt(0)==="i"){debts=debts.filter(function(x){return "i"+x.id!==r})}
else if(r){debts.forEach(function(x){x.pays=x.pays.filter(function(p){return p.ref!==r})})}
data.splice(+i,1);
save();saveD();render();renderDebts();updateFields();
};
setInterval(render,30000);

var debts=[];
try{debts=JSON.parse(localStorage.getItem("debts")||"[]")}catch(e){}
function saveD(){try{localStorage.setItem("debts",JSON.stringify(debts))}catch(e){}}
function bd(n){return String(n).replace(/\d/g,function(d){return bn[d]})}
function clean(v){return v.replace(/[<>&]/g,"").trim()}
function today0(){return new Date().toLocaleDateString("bn-BD")}
debts.forEach(function(d,i){
if(!d.id)d.id=Date.now()+i;
if(!d.dir)d.dir="b";
if(!d.pays)d.pays=d.p?[{a:d.a,ref:d.id}]:[];
});
saveD();
function paidOf(d){return d.pays.reduce(function(s,p){return s+p.a},0)}
function remOf(d){return Math.max(0,Math.round((d.a-paidOf(d))*100)/100)}

function renderDebts(){
var owe=0,recv=0,order=debts.map(function(d,i){return i});
order.sort(function(x,y){
var a=debts[x],b=debts[y],pa=remOf(a)===0,pb=remOf(b)===0;
if(pa!==pb)return pa?1:-1;
return (a.due||"9999").localeCompare(b.due||"9999");
});
var today=new Date();today.setHours(0,0,0,0);
var l="";
order.forEach(function(i){
var d=debts[i],rem=remOf(d),paid=rem===0,lent=d.dir==="l",nm=d.w||"নাম নেই",st="",cls="";
if(!paid){if(lent)recv+=rem;else owe+=rem}
var title=paid?nm+" — পুরোটা মিটে গেছে":(lent?nm+" এর কাছ থেকে পাব: "+f(rem):nm+" কে দিতে হবে: "+f(rem));
var sub="মোট ধার "+f(d.a)+" · "+(lent?"ফেরত পেয়েছি ":"শোধ করেছি ")+f(paidOf(d));
if(!paid&&d.due){
var diff=Math.round((new Date(d.due+"T00:00:00")-today)/86400000);
var dt=new Date(d.due+"T00:00:00").toLocaleDateString("bn-BD");
if(diff<0){st=dt+" · "+bd(-diff)+" দিন দেরি হয়েছে";cls="late"}
else if(diff===0){st=dt+" · আজই "+(lent?"ফেরত পাওয়ার":"ফেরত দেওয়ার")+" কথা";cls="late"}
else{st=dt+" · আর "+bd(diff)+" দিন বাকি"}
}
var btns="";
if(d.pays.length)btns+='<button class="pd" data-di="'+i+'" data-act="u">'+(lent?"↩ শেষ ফেরত বাতিল":"↩ শেষ শোধ বাতিল")+'</button>';
btns+='<button class="x" data-di="'+i+'" data-act="x">✕</button>';
l+='<div style="padding:10px 0;border-bottom:1px solid var(--bd)"><div class="'+(paid?"done":"")+'"><div class="'+(paid?"":(lent?"inc":"exp"))+'">'+title+'</div><div class="mu">'+sub+'</div>'+(st?'<div class="mu '+cls+'">'+st+'</div>':'')+'</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">'+btns+'</div></div>';
});
var parts=[];
if(owe>0)parts.push("আমার দেনা: "+f(owe));
if(recv>0)parts.push("আমার পাওনা: "+f(recv));
document.getElementById("oweT").textContent=f(owe);document.getElementById("recT").textContent=f(recv);
document.getElementById("dTot").textContent=parts.length?parts.join(" · "):(debts.length?"সব ধার মিটে গেছে":"");
document.getElementById("dlist").innerHTML=l||'<div class="mu">এখনো কোনো ধার নেই</div>';
}

var dueEl=document.getElementById("due");
dueEl.onclick=dueEl.onfocus=function(){try{if(this.showPicker)this.showPicker()}catch(e){}};
document.getElementById("dlist").onclick=function(e){
var i=e.target.getAttribute("data-di");
if(i===null)return;
var act=e.target.getAttribute("data-act"),d=debts[+i];
if(!d)return;
if(act==="x"){
if(!confirm("এই ধারের সব হিসাব অ্যাপ থেকে সরে যাবে। মুছবে?"))return;
data=data.filter(function(x){var r=String(x.ref||"");return !(r==="i"+d.id||r===String(d.id)||r.indexOf(d.id+"-")===0)});
debts.splice(+i,1);
}else if(act==="u"){
var last=d.pays.pop();
if(last)data=data.filter(function(x){return x.ref!==last.ref});
}
save();saveD();render();renderDebts();updateFields();
};
setType("e");
render();renderDebts();flush();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
</html>
